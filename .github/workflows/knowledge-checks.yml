name: Knowledge Checks

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/skills/**'
      - '.agents/skills/**'
      - 'pyproject.toml'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'HOW_TO_ADD_CONTENT.md'
  pull_request:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/skills/**'
      - '.agents/skills/**'
      - 'pyproject.toml'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'HOW_TO_ADD_CONTENT.md'

jobs:
  knowledge-checks:
    name: OKF + Domain Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run complete non-mutating repository checks
        run: npm run check

      - name: Build static preview foundation
        run: TNX_BUILD_MODE=preview npm run web:build
